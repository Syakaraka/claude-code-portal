name: claude-code

# =============================================================
# Phase 1 多用户架构
# =============================================================
# 本 compose 文件只跑 portal。claude-code:local 镜像由 portal 动态拉起。
#
# 启动顺序（首次）：
#   1. 复制 .env.example 为 .env，按需修改（端口 / 路径）
#   2. docker build . -t claude-code:local        # 构建 claude-code 镜像
#   3. docker compose build                       # 构建 portal 镜像
#   4. docker compose up -d                       # 启动 portal
#
# 用户访问流程：浏览器 → http://server:${PORTAL_HOST_PORT}/ → portal → 填表 →
#              portal 拉起 claude-<uid> 容器 → 重定向到 http://server:${CLAUDE_PORT_MIN..MAX}/
#
# 全部路径 / 端口 / 镜像名由 .env 控制；详见 .env.example + ARCHITECTURE.md §15
# =============================================================

services:
  portal:
    build: ./portal
    image: claude-portal:local
    container_name: claude-portal
    pull_policy: never

    # 主入口：用户在浏览器访问这个端口
    # HOST_PORT 与 CONTAINER_PORT 都从 .env 读，默认 9900
    # 如果改了 PORTAL_HOST_PORT 但没改 PORTAL_CONTAINER_PORT，portal/Dockerfile 要
    # 同步重建（gunicorn 绑 CONTAINER_PORT），否则端口不一致
    ports:
      - "${PORTAL_HOST_PORT:-9900}:${PORTAL_CONTAINER_PORT:-9900}"

    # 关键：让 portal 容器能控制宿主机上的 Docker（启动/停止 claude 容器）
    # 注意 docker.run() 的 bind source 必须是 host 上的真实绝对路径，
    # 而不能是 portal 容器内的 /volumes/...（docker daemon 解析不到）
    # 所以 portal 通过 HOST_PROJECT_DIR 等 env 拿到 host 上项目目录的绝对路径
    # 详见 portal/app.py 常量段 + ARCHITECTURE.md §5.2 / §15
    env_file:
      - .env

    volumes:
      # Docker socket 路径可配置（macOS / 自定义 docker 路径场景）
      - ${HOST_DOCKER_SOCK:-/var/run/docker.sock}:${HOST_DOCKER_SOCK:-/var/run/docker.sock}

      # 项目本地 volumes 挂到 portal 容器内的 /volumes（仅供 portal 通过
      # shutil/os 操作读取 volumes/code、volumes/node 模板，写入 volumes/users）
      # 真正传给 docker.run() 的 bind source 用 HOST_USERS_DIR / HOST_CODE_DIR 等
      # host 绝对路径（见 app.py），保证 docker daemon 解析到正确的 host 位置
      - ${HOST_VOLUMES_DIR}:${PORTAL_VOLUMES_MOUNT:-/volumes}

    restart: unless-stopped